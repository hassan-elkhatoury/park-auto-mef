# ==============================================================================
# Configuration Nginx de Production — Frontend Park Auto MEF
# Conforme aux normes d'architecture et de sécurité DGSSI / MEF
# ==============================================================================

server {
    listen 80;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité HTTP (Recommandations DGSSI)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS : effectif lorsque le reverse-proxy TLS institutionnel (MEF) est en frontal
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP stricte : pas d'eval, scripts uniquement depuis l'origine ; styles inline
    # nécessaires à Tailwind/animations runtime.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none';" always;

    # Taille max des uploads GED (alignée sur le backend : 15 Mo)
    client_max_body_size 16m;

    # Compression Gzip pour optimisation des performances (< 200 ms)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json application/javascript image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Cache des ressources statiques (Vite assets hashés)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Proxy Inverse vers l'API Backend Spring Boot
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Gestion des timeouts pour les exports massifs (Excel, PDF)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Healthcheck backend exposé au superviseur (lecture seule, sans détails)
    location = /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        proxy_set_header Host $host;
    }

    # Routage Single Page Application (SPA React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gestion des erreurs HTTP
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
