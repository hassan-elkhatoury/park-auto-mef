# ==============================================================================
# Docker Compose — Système Intégré de Gestion du Parc Automobile (MEF)
# Orchestration Multi-Conteneurs : PostgreSQL, Backend Spring Boot, Frontend Nginx
# Conforme aux spécifications du CdC MEF Section 26
#
# SECRETS : aucun secret n'est stocké dans ce fichier. Copier `.env.example` vers
# `.env` et renseigner DB_PASSWORD, JWT_SECRET, ADMIN_PASSWORD, MAIL_*.
# Le démarrage échoue explicitement si une variable obligatoire est absente.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Base de Données Relationnelle PostgreSQL 16
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: parkauto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-park_auto_mef}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est obligatoire (voir .env.example)}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    # Port non exposé sur l'hôte : la base n'est accessible que depuis le réseau interne.
    # Pour un accès d'administration ponctuel : `docker compose exec postgres psql ...`
    expose:
      - "5432"
    networks:
      - parkauto-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-park_auto_mef}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Serveur Backend — API REST Spring Boot 3 / Java 17
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./park-auto-mef
      dockerfile: Dockerfile
    container_name: parkauto-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-park_auto_mef}?useUnicode=true&characterEncoding=UTF-8
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est obligatoire (voir .env.example)}
      DDL_AUTO: ${DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est obligatoire (>= 32 caractères aléatoires)}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-14400000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mef.gov.ma}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD est obligatoire}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-parc-auto@mef.gov.ma}
      GED_UPLOAD_DIR: /app/uploads
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    volumes:
      - ged_uploads:/app/uploads
    # Port non exposé : l'API n'est joignable que via le reverse-proxy Nginx (frontend)
    expose:
      - "8080"
    networks:
      - parkauto-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ----------------------------------------------------------------------------
  # 3. Serveur Frontend Web — React / Vite / Nginx Reverse Proxy
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./park-auto-frontend
      dockerfile: Dockerfile
    container_name: parkauto-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - parkauto-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

# ------------------------------------------------------------------------------
# Volumes Persistants
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  ged_uploads:
    driver: local

# ------------------------------------------------------------------------------
# Réseau Inter-Conteneurs Dédié
# ------------------------------------------------------------------------------
networks:
  parkauto-network:
    driver: bridge
