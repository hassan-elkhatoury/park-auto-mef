# ============================================
# Server Configuration
# ============================================
server.port=8080
server.tomcat.max-http-request-header-size=64KB
server.tomcat.max-http-response-header-size=64KB

# Active profile: prod (PostgreSQL database)
spring.profiles.active=prod

# ============================================
# Default Local H2 In-Memory DataSource Configuration
# ============================================
spring.datasource.url=jdbc:h2:mem:park_auto_mef;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================
# JPA / Hibernate Configuration
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ============================================
# JWT Configuration (externalized secrets)
# ============================================
app.jwt.secret=${JWT_SECRET:my-super-secret-jwt-signing-key-that-must-be-at-least-256-bits-long-for-HS256}
app.jwt.access-token-expiration=14400000
app.jwt.refresh-token-expiration=86400000

# ============================================
# Default Admin (from environment variables)
# ============================================
app.admin.email=${ADMIN_EMAIL:admin@mef.gov.ma}
app.admin.password=${ADMIN_PASSWORD:Admin@2026}

# ============================================
# Swagger / OpenAPI
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Gmail Real SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=elkhatoury@gmail.com
spring.mail.password=${MAIL_PASSWORD:j7kadpkutrmnzshunts4vqetq7mi3cns}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=elkhatoury@gmail.com
