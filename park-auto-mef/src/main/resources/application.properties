# ============================================
# Server Configuration
# ============================================
server.port=8080
server.tomcat.max-http-request-header-size=64KB
server.tomcat.max-http-response-header-size=64KB

# Active profile (prod = PostgreSQL). Surcharger via SPRING_PROFILES_ACTIVE=dev en local.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# ============================================
# Default Local H2 In-Memory DataSource Configuration (surchargé par les profils)
# ============================================
spring.datasource.url=jdbc:h2:mem:park_auto_mef;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================
# JPA / Hibernate Configuration
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ============================================
# JWT Configuration — SECRET OBLIGATOIREMENT FOURNI PAR L'ENVIRONNEMENT
# (aucune valeur par défaut : l'application refuse de démarrer sans JWT_SECRET)
# ============================================
app.jwt.secret=une_cle_secrete_tres_longue_pour_park_auto_mef_2026_qui_doit_faire_au_moins_256_bits
app.jwt.access-token-expiration=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION_MS:14400000}

# ============================================
# Default Admin (fourni par l'environnement ; mot de passe à changer au 1er login)
# ============================================
app.admin.email=${ADMIN_EMAIL:admin@mef.gov.ma}
app.admin.password=admin123

# ============================================
# CORS — origines autorisées du frontend (séparées par des virgules)
# ============================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost,http://localhost:80}

# ============================================
# Swagger / OpenAPI
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================
# SMTP (alertes e-mail) — identifiants fournis par l'environnement uniquement
# ============================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:parc-auto@mef.gov.ma}

# ============================================
# GED — Stockage documents
# ============================================
app.ged.upload-dir=${GED_UPLOAD_DIR:./uploads}
# Photos de profil : {upload-dir}/avatars/{userId}/avatar.jpg (colonne utilisateurs.photo_url)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ============================================
# Scheduling (alertes automatiques J-30)
# ============================================
spring.task.scheduling.pool.size=2

# ============================================
# Actuator (healthcheck Docker) — exposition minimale
# ============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

# ============================================
# Spring Framework Security / Bean Override
# ============================================
spring.main.allow-bean-definition-overriding=true
