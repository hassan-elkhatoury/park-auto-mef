# ============================================
# Profil DEV (poste développeur uniquement — JAMAIS en production)
# H2 en mémoire, secrets de développement non sensibles.
# ============================================
spring.datasource.url=jdbc:h2:mem:park_auto_mef;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# JWT Configuration (clé de DEV, sans valeur en production)
# ============================================
app.jwt.secret=${JWT_SECRET:dev-only-jwt-signing-key-not-for-production-use-0123456789abcdef}
app.jwt.access-token-expiration=14400000
app.jwt.refresh-token-expiration=86400000

# ============================================
# Default Admin (DEV)
# ============================================
app.admin.email=${ADMIN_EMAIL:admin@mef.gov.ma}
app.admin.password=${ADMIN_PASSWORD:Admin@2026}

# CORS dev (Vite)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost

# ============================================
# Swagger / OpenAPI
# ============================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
