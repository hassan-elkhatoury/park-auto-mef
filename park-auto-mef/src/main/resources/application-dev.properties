# ============================================
# H2 Dev Database Configuration (Fallback)
# ============================================
spring.datasource.url=jdbc:h2:mem:park_auto_mef;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# JWT Configuration
# ============================================
app.jwt.secret=my-super-secret-jwt-signing-key-that-must-be-at-least-256-bits-long-for-HS256
app.jwt.access-token-expiration=14400000
app.jwt.refresh-token-expiration=86400000

# ============================================
# Default Admin
# ============================================
app.admin.email=admin@mef.gov.ma
app.admin.password=Admin@2026

# ============================================
# Swagger / OpenAPI
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
