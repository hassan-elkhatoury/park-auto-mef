# ============================================
# PostgreSQL Production Profile Configuration
# ============================================
server.port=8080
server.tomcat.max-http-request-header-size=64KB
server.tomcat.max-http-response-header-size=64KB
spring.datasource.url=jdbc:postgresql://localhost:5432/park_auto_mef
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:0000}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA / Hibernate Configuration for PostgreSQL
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# JWT Configuration
# ============================================
app.jwt.secret=${JWT_SECRET:my-super-secret-jwt-signing-key-that-must-be-at-least-256-bits-long-for-HS256}
app.jwt.access-token-expiration=14400000
app.jwt.refresh-token-expiration=86400000

# ============================================
# Default Admin
# ============================================
app.admin.email=${ADMIN_EMAIL:admin@mef.gov.ma}
app.admin.password=${ADMIN_PASSWORD:Admin@2026}

# ============================================
# Swagger / OpenAPI
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================
# Gmail SMTP Email Configuration
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=elkhatoury@gmail.com
spring.mail.password=${MAIL_PASSWORD:j7kadpkutrmnzshunts4vqetq7mi3cns}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
