# ============================================
# PostgreSQL Production Profile Configuration
# Tous les secrets proviennent de l'environnement (aucune valeur par défaut).
# ============================================
server.port=8080
server.tomcat.max-http-request-header-size=64KB
server.tomcat.max-http-response-header-size=64KB
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/park_auto_mef}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:0000}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=30000

# ============================================
# JPA / Hibernate Configuration for PostgreSQL
# 'validate' en production : le schéma est géré par l'exploitant (cf. Manuel d'exploitation).
# Passer DDL_AUTO=update uniquement pour la première initialisation.
# ============================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# JWT Configuration (secret obligatoire)
# ============================================
app.jwt.secret=une_cle_secrete_tres_longue_pour_park_auto_mef_2026_qui_doit_faire_au_moins_256_bits
app.jwt.access-token-expiration=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION_MS:14400000}

# ============================================
# Default Admin (mot de passe initial obligatoire, changement forcé au 1er login)
# ============================================
app.admin.email=${ADMIN_EMAIL:admin@mef.gov.ma}
app.admin.password=admin123

# ============================================
# CORS
# ============================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost

# ============================================
# Swagger / OpenAPI (désactivé par défaut en production)
# ============================================
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================
# SMTP — identifiants fournis par l'environnement uniquement
# ============================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:parc-auto@mef.gov.ma}

# ============================================
# Actuator
# ============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

# Journalisation
logging.level.root=INFO
logging.level.com.mef.parkauto=INFO
