# ============================================
# H2 Test Database Configuration
# ============================================
spring.datasource.url=jdbc:h2:mem:park_auto_mef_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT config for testing
app.jwt.secret=test-secret-key-must-be-at-least-256-bits-long-for-hs256-signature-algorithm-otherwise-it-fails
app.jwt.access-token-expiration=60000
app.jwt.refresh-token-expiration=600000

# Default Admin credentials for testing
app.admin.email=admin@mef.gov.ma
app.admin.password=Admin@2026

# Mail désactivé en test
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
app.mail.from=test@mef.gov.ma
app.cors.allowed-origins=http://localhost:5173
management.health.mail.enabled=false
